# ============================
# IES La Vereda - AMPA Libros
# ============================

spring.datasource.url=jdbc:mysql://localhost:3306/IesLaVereda?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Madrid
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never

spring.jpa.open-in-view=false

server.port=8080

spring.application.name=ieslavereda-ampa
